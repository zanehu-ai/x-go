name: API Surface Diff

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: api-surface-diff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apidiff:
    name: gorelease (semver compatibility report)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Install gorelease
        run: go install golang.org/x/exp/cmd/gorelease@latest

      - name: Determine baseline
        id: baseline
        run: |
          # Pick the latest tag reachable from main as the baseline. If no
          # tag exists yet, fall back to comparing against origin/main directly.
          LATEST_TAG=$(git describe --tags --abbrev=0 origin/main 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            echo "baseline=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "mode=tag" >> "$GITHUB_OUTPUT"
          else
            echo "baseline=origin/main" >> "$GITHUB_OUTPUT"
            echo "mode=branch" >> "$GITHUB_OUTPUT"
          fi
          echo "Baseline: ${LATEST_TAG:-origin/main}"

      - name: Run gorelease
        id: gorelease
        env:
          BASELINE: ${{ steps.baseline.outputs.baseline }}
          MODE: ${{ steps.baseline.outputs.mode }}
        run: |
          set +e
          mkdir -p .reports
          if [ "$MODE" = "tag" ]; then
            gorelease -base="$BASELINE" > .reports/gorelease.txt 2>&1
          else
            # No tag yet; show diff against main HEAD using apidiff instead
            go install golang.org/x/exp/cmd/apidiff@latest
            apidiff -m -w .reports/api-base.json "$BASELINE" 2>.reports/apidiff-base.err || true
            apidiff -m .reports/api-base.json . > .reports/gorelease.txt 2>&1
          fi
          RC=$?
          cat .reports/gorelease.txt
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          # warn-only: do not fail the job; PR comment surfaces findings
          exit 0

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-surface-diff-report
          path: .reports/

      - name: Comment PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASELINE: ${{ steps.baseline.outputs.baseline }}
          MODE: ${{ steps.baseline.outputs.mode }}
          RC: ${{ steps.gorelease.outputs.rc }}
        run: |
          {
            echo "## 🔍 API Surface Diff (gorelease)"
            echo ""
            echo "Baseline: \`$BASELINE\` (mode=$MODE)"
            echo ""
            if [ ! -s .reports/gorelease.txt ]; then
              echo "⚠ gorelease produced no output (exit=$RC). Tool may have crashed; check workflow logs."
            else
              echo '```'
              head -120 .reports/gorelease.txt
              echo '```'
              echo ""
              echo "Full report: see Actions artifact \`api-surface-diff-report\`."
              echo ""
              echo "warn-only — does not block merge. Breaking changes (major-bumping incompatibilities) should be coordinated with downstream consumers (opcorbit, etc.) before merge."
            fi
          } > .reports/api-diff-comment.md
          gh pr comment "$PR_NUMBER" --body-file .reports/api-diff-comment.md || true
