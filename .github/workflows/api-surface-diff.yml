name: API Surface Diff

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: api-surface-diff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apidiff:
    name: gorelease (semver compatibility report)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Install gorelease
        run: go install golang.org/x/exp/cmd/gorelease@latest

      - name: Determine baseline
        id: baseline
        run: |
          # Pick the latest tag reachable from main as the baseline. If no
          # tag exists yet, fall back to comparing against origin/main directly.
          LATEST_TAG=$(git describe --tags --abbrev=0 origin/main 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            echo "baseline=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "mode=tag" >> "$GITHUB_OUTPUT"
          else
            echo "baseline=origin/main" >> "$GITHUB_OUTPUT"
            echo "mode=branch" >> "$GITHUB_OUTPUT"
          fi
          echo "Baseline: ${LATEST_TAG:-origin/main}"

      - name: Run gorelease / apidiff
        id: gorelease
        env:
          BASELINE: ${{ steps.baseline.outputs.baseline }}
          MODE: ${{ steps.baseline.outputs.mode }}
        run: |
          set +e
          mkdir -p .reports
          if [ "$MODE" = "tag" ]; then
            # gorelease accepts -base=<version> and compares working tree
            # against the published tag's API surface.
            gorelease -base="$BASELINE" > .reports/gorelease.txt 2>&1
            RC=$?
          else
            # Branch-mode: no tag exists yet. Properly check out the
            # baseline ref to a worktree, run apidiff against package paths
            # (apidiff needs ./... or module-path args, NOT git refs).
            go install golang.org/x/exp/cmd/apidiff@latest
            APIDIFF=$(go env GOPATH)/bin/apidiff
            BASE_WT="$RUNNER_TEMP/synapse-go-baseline"
            rm -rf "$BASE_WT"
            # Unconditional cleanup so self-hosted runners do not accumulate
            # stale worktrees + .git/worktrees/ entries on apidiff failures
            # (GH-hosted runners wipe RUNNER_TEMP between jobs anyway).
            trap 'git worktree remove --force "$BASE_WT" 2>/dev/null || true' EXIT
            git worktree add --detach "$BASE_WT" "$BASELINE" 2>.reports/worktree.err
            WT_RC=$?
            if [ "$WT_RC" -ne 0 ]; then
              {
                echo "## API Surface Diff — could not establish baseline"
                echo ""
                echo "git worktree add for $BASELINE failed (rc=$WT_RC):"
                echo ""
                cat .reports/worktree.err
              } > .reports/gorelease.txt
              RC=$WT_RC
            else
              # Capture baseline API surface
              if "$APIDIFF" -w .reports/api-base.json "$BASE_WT/..." > .reports/apidiff-base.log 2>&1; then
                # apidiff baseline is gob-encoded binary (NOT JSON — the
                # previous R5 jq -e check was wrong and rejected every valid
                # baseline). The only meaningful sanity check at this layer
                # is non-empty file; partial / corrupt gob will surface as a
                # parse error in the next apidiff invocation, which is
                # captured into gorelease.txt for the reviewer.
                #
                # Set a floor: a healthy synapse-go baseline is tens of KB.
                # < 100 bytes almost certainly = scan aborted very early.
                BASE_SIZE=$(wc -c < .reports/api-base.json | tr -d ' ')
                if [ -z "$BASE_SIZE" ] || [ "$BASE_SIZE" -lt 100 ]; then
                  {
                    echo "## API Surface Diff — baseline suspiciously small ($BASE_SIZE bytes)"
                    echo ""
                    echo "apidiff returned rc=0 but produced a tiny baseline file."
                    echo "Floor is 100 bytes; healthy synapse-go baseline is tens of KB."
                    echo "Likely the baseline worktree failed to scan most packages."
                    echo ""
                    echo "apidiff -w log:"
                    cat .reports/apidiff-base.log
                  } > .reports/gorelease.txt
                  RC=1
                else
                  # Compare current tree against captured baseline
                  "$APIDIFF" .reports/api-base.json ./... > .reports/gorelease.txt 2>&1
                  RC=$?
                fi
              else
                {
                  echo "## API Surface Diff — baseline capture failed"
                  echo ""
                  echo "apidiff -w against $BASE_WT did not produce a usable baseline:"
                  echo ""
                  cat .reports/apidiff-base.log
                } > .reports/gorelease.txt
                RC=1
              fi
            fi
          fi
          cat .reports/gorelease.txt
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          # warn-only: do not fail the job; PR comment surfaces findings
          exit 0

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-surface-diff-report
          path: .reports/

      - name: Comment PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASELINE: ${{ steps.baseline.outputs.baseline }}
          MODE: ${{ steps.baseline.outputs.mode }}
          RC: ${{ steps.gorelease.outputs.rc }}
        run: |
          {
            echo "## 🔍 API Surface Diff (gorelease)"
            echo ""
            echo "Baseline: \`$BASELINE\` (mode=$MODE)"
            echo ""
            if [ ! -s .reports/gorelease.txt ]; then
              echo "⚠ gorelease produced no output (exit=$RC). Tool may have crashed; check workflow logs."
            else
              echo '```'
              head -120 .reports/gorelease.txt
              echo '```'
              echo ""
              echo "Full report: see Actions artifact \`api-surface-diff-report\`."
              echo ""
              echo "warn-only — does not block merge. Breaking changes (major-bumping incompatibilities) should be coordinated with downstream consumers (opcorbit, etc.) before merge."
            fi
          } > .reports/api-diff-comment.md
          gh pr comment "$PR_NUMBER" --body-file .reports/api-diff-comment.md || true
