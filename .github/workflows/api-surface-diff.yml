name: API Surface Diff

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: api-surface-diff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apidiff:
    name: gorelease (semver compatibility report)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare report directory
        id: reports
        run: |
          set -euo pipefail
          REPORT_DIR="$RUNNER_TEMP/api-surface-diff-report"
          mkdir -p "$REPORT_DIR"
          echo "REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Install gorelease
        run: go install golang.org/x/exp/cmd/gorelease@latest

      - name: Determine baseline
        id: baseline
        run: |
          # Pick the latest tag reachable from main as the baseline. If no
          # tag exists yet, fall back to comparing against origin/main directly.
          LATEST_TAG=$(git describe --tags --abbrev=0 origin/main 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            echo "baseline=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "mode=tag" >> "$GITHUB_OUTPUT"
          else
            echo "baseline=origin/main" >> "$GITHUB_OUTPUT"
            echo "mode=branch" >> "$GITHUB_OUTPUT"
          fi
          echo "Baseline: ${LATEST_TAG:-origin/main}"

      - name: Run gorelease / apidiff
        id: gorelease
        env:
          BASELINE: ${{ steps.baseline.outputs.baseline }}
          MODE: ${{ steps.baseline.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          REPORT="$REPORT_DIR/gorelease.txt"
          RC=1
          STATUS=tool-error
          if [ "$MODE" = "tag" ]; then
            # Keep stdout separate: gorelease uses exit 1 for both findings
            # and tool failures. Completed release diagnostics are findings,
            # while package-loading errors mean the API report is incomplete.
            if gorelease -base="$BASELINE" > "$REPORT" 2> "$REPORT_DIR/gorelease.err"; then
              RC=0
            else
              RC=$?
            fi
            if [ "$RC" -le 1 ] && [ -s "$REPORT" ] &&
                grep -qx '# summary' "$REPORT" &&
                ! grep -Eq '^## errors in (base|release) version:' "$REPORT" &&
                [ ! -s "$REPORT_DIR/gorelease.err" ]; then
              STATUS=complete
            fi
            cat "$REPORT_DIR/gorelease.err" >> "$REPORT"
          else
            # apidiff returns 0 for API differences; nonzero means a tool error.
            if go install golang.org/x/exp/cmd/apidiff@latest > "$REPORT_DIR/apidiff-install.log" 2>&1; then
              APIDIFF="$(go env GOPATH)/bin/apidiff"
              BASE_WT=$(mktemp -d "$RUNNER_TEMP/synapse-go-baseline.XXXXXX")
              trap 'git worktree remove --force "$BASE_WT" 2>/dev/null || true' EXIT
              if git worktree add --detach "$BASE_WT" "$BASELINE" 2> "$REPORT_DIR/worktree.err"; then
                # Scan the whole baseline module from its own checkout.
                if (cd "$BASE_WT" &&
                    BASE_MODULE=$(go list -m) &&
                    "$APIDIFF" -m -w "$REPORT_DIR/api-base.gob" "$BASE_MODULE") > "$REPORT_DIR/apidiff-base.log" 2>&1; then
                  BASE_SIZE=0
                  if [ -s "$REPORT_DIR/api-base.gob" ]; then
                    BASE_SIZE=$(wc -c < "$REPORT_DIR/api-base.gob" | tr -d ' ')
                  fi
                  if [ "$BASE_SIZE" -ge 100 ]; then
                    if CURRENT_MODULE=$(go list -m) &&
                        "$APIDIFF" -m "$REPORT_DIR/api-base.gob" "$CURRENT_MODULE" > "$REPORT" 2>&1; then
                      RC=0
                      STATUS=complete
                      if [ ! -s "$REPORT" ]; then
                        echo "No API differences from $BASELINE (apidiff module comparison completed)." > "$REPORT"
                      fi
                    else
                      RC=$?
                    fi
                  else
                    echo "Baseline export is suspiciously small ($BASE_SIZE bytes; minimum 100)." > "$REPORT"
                  fi
                else
                  RC=$?
                  {
                    echo "API baseline capture failed (exit=$RC)."
                    cat "$REPORT_DIR/apidiff-base.log"
                  } > "$REPORT"
                fi
              else
                RC=$?
                {
                  echo "Could not establish baseline $BASELINE (exit=$RC)."
                  cat "$REPORT_DIR/worktree.err"
                } > "$REPORT"
              fi
            else
              RC=$?
              {
                echo "Could not install apidiff (exit=$RC)."
                cat "$REPORT_DIR/apidiff-install.log"
              } > "$REPORT"
            fi
          fi
          if [ "$STATUS" = "tool-error" ]; then
            echo "API comparison did not complete successfully (tool/setup failure; exit=$RC)." >> "$REPORT"
            echo "::error::API report generation failed; see api-surface-diff-report."
          elif [ "$RC" -ne 0 ]; then
            echo "::warning::Completed API/semver report has findings (exit=$RC); findings remain warn-only."
          fi
          cat "$REPORT"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          # API findings remain warn-only; tool/setup failures fail visibly.
          [ "$STATUS" = "complete" ]

      - name: Upload report
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-surface-diff-report
          path: ${{ runner.temp }}/api-surface-diff-report/
          if-no-files-found: error

      - name: Comment PR
        if: always() && github.event_name == 'pull_request' && steps.gorelease.outputs.status != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASELINE: ${{ steps.baseline.outputs.baseline }}
          MODE: ${{ steps.baseline.outputs.mode }}
          RC: ${{ steps.gorelease.outputs.rc }}
          STATUS: ${{ steps.gorelease.outputs.status }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          {
            echo "## 🔍 API Surface Diff (gorelease)"
            echo ""
            echo "Baseline: \`$BASELINE\` (mode=$MODE)"
            echo ""
            if [ ! -s "$REPORT_DIR/gorelease.txt" ]; then
              echo "⚠ gorelease produced no output (exit=$RC). Tool may have crashed; check workflow logs."
            else
              echo '```'
              head -120 "$REPORT_DIR/gorelease.txt"
              echo '```'
              echo ""
              if [ "$UPLOAD_OUTCOME" = "success" ]; then
                echo "Full report: see Actions artifact \`api-surface-diff-report\`."
              else
                echo "Report upload failed; see workflow logs."
              fi
              echo ""
              if [ "$STATUS" = "complete" ]; then
                echo "API compatibility findings are warn-only — do not block merge. Breaking changes should be coordinated with downstream consumers (opcorbit, etc.) before merge."
              else
                echo "❌ Tool/setup failure (exit=$RC): API comparison did not complete; check workflow logs. This is not an API compatibility finding."
              fi
            fi
          } > "$REPORT_DIR/api-diff-comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$REPORT_DIR/api-diff-comment.md" || echo "::warning::Could not post API report comment."
